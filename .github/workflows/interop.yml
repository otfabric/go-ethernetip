name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-ethernetip against the reference implementations published by
# otfabric/ethernetip-interop (OpENer, cpppo, EIPScanner, pycomm3), in both
# roles, on the Docker network of a native runner of each architecture.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "ethernetip-interop image tag (default: the release pinned in interop/harness_test.go)"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  interop:
    name: Interop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      ETHERNETIP_INTEROP_VERSION: ${{ inputs.version }}
      ETHERNETIP_INTEROP_WRITE_MATRIX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-interop
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-matrix-${{ matrix.arch }}
          path: interop/results/matrix.json
          if-no-files-found: warn
