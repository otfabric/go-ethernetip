name: Fuzz (long)
run-name: "Fuzz (long) by @${{ github.actor }}"

# Every fuzz target for 10 minutes, nightly.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz 10m
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=10m
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: warn
